spring.application.name=peerskillexchange

spring.datasource.url = ${DATASOURCE_URL}
spring.datasource.username = ${DATASOURCE_USERNAME}
spring.datasource.password = ${DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto = update


frontend.url = ${FRONTEND_URL}

jwt.key = ${JWT_KEY}

#springdoc.api-docs.enabled=true
#springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path = /doc

resend.api.key=${RESEND_API_KEY}

# Mail setup for verification emails
app.mail.from = ${MAIN_EMAIL}
 spring.mail.host = ${MAIL_HOST}
 spring.mail.port = ${MAIL_PORT}
 spring.mail.username = ${MAIL_USERNAME}
 spring.mail.password = ${MAIL_PASSWORD}
 spring.mail.properties.mail.smtp.auth = true
 spring.mail.properties.mail.smtp.starttls.enable = true
 spring.mail.properties.mail.smtp.starttls.required = true

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=0

# Board event log and rebuildable cache
board.kafka.enabled=${BOARD_KAFKA_ENABLED:true}
board.kafka.topic=${BOARD_KAFKA_TOPIC:pse-board-operations-v1}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.delivery.timeout.ms=6000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.consumer.group-id=${BOARD_KAFKA_GROUP:pse-board-projection-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
management.endpoints.web.exposure.include=health,info,prometheus
